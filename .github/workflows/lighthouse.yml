name: Lighthouse CI

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      preview_url:
        description: 'Vercel preview URL to audit'
        required: true
        type: string

# F82, F90: explicit least-privilege token.
#   - contents: read       — checkout
#   - pull-requests: write — post the score-summary comment
permissions:
  contents: read
  pull-requests: write

jobs:
  lighthouse:
    name: Lighthouse audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'

      # PR previews can be protected by Vercel Authentication and return 401
      # to CI even after a successful deployment. Audit the exact branch
      # production bundle locally instead; production-header parity remains
      # covered by e2e/prod-headers.spec.ts in the main CI workflow.
      - name: Install dependencies
        if: github.event_name == 'pull_request'
        run: npm ci

      - name: Build production app
        if: github.event_name == 'pull_request'
        run: npm run build

      - name: Start local production preview
        if: github.event_name == 'pull_request'
        run: |
          nohup npm run preview -- --host 127.0.0.1 > /tmp/lighthouse-preview.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fs http://127.0.0.1:5001/ > /dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/lighthouse-preview.log
          exit 1

      # F91: do NOT interpolate ${{ ... }} into bash bodies. Pass via env
      # and read "$VAR" — defends against script-injection.
      - name: Resolve audit URL
        id: url
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_URL: ${{ inputs.preview_url }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "preview_url=$INPUT_URL" >> "$GITHUB_OUTPUT"
            echo "target_label=$INPUT_URL" >> "$GITHUB_OUTPUT"
          else
            echo "preview_url=http://127.0.0.1:5001" >> "$GITHUB_OUTPUT"
            echo "target_label=PR production build (local preview)" >> "$GITHUB_OUTPUT"
          fi

      # F81: score budgets enforced via lighthouserc.json (perf >=0.9,
      # a11y >=0.95, best-practices >=0.95, SEO >=0.9 per OUT-6).
      # F92: temporaryPublicStorage:true publishes the full report (incl.
      # screenshots) to a PUBLIC bucket so the PR comment can deep-link.
      # Intentional — preview URLs are already public — but DO NOT enable
      # this on a workflow that audits an authenticated/internal page.
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@512cc908a55bfb0ad231facca52adf3d3a651df4 # v12
        id: lhci
        with:
          urls: |
            ${{ steps.url.outputs.preview_url }}
          runs: 3
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

      # F91: pass interpolated values via env, read with process.env.X inside
      # the github-script body (not template-string interpolation).
      - name: Comment Lighthouse scores on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          LHCI_LINKS: ${{ steps.lhci.outputs.links }}
          AUDIT_TARGET: ${{ steps.url.outputs.target_label }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const links = process.env.LHCI_LINKS || '';
            const target = process.env.AUDIT_TARGET || '';
            const body = [
              '### Lighthouse CI',
              '',
              `**Target:** ${target}`,
              '',
              '**Reports:**',
              '```',
              links || '(no links produced)',
              '```',
              '',
              '<sub>Generated by `.github/workflows/lighthouse.yml`. Score budgets in `lighthouserc.json`.</sub>',
            ].join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
